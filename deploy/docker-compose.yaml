# Nereus single-host stack: Doris FE + BE, schema init, OTel Collector, PostgreSQL for
# metadata, the Nereus API + UI, and telemetrygen as a demo traffic source.
#
#   cd deploy && docker compose up -d
#   UI: http://localhost:8090 (first visit creates the admin account)
#   OTLP: grpc localhost:4317, http localhost:4318; Doris MySQL: localhost:9030
#
# DORIS_VERSION must support search() and partition.retention_count; see README.
name: nereus

networks:
  nereus:
    ipam:
      config:
        - subnet: 172.30.80.0/24
          # Keep dynamic addresses separate from the FE and BE addresses.
          ip_range: 172.30.80.128/25

services:
  doris-fe:
    image: apache/doris:fe-${DORIS_VERSION:-4.1.5}
    hostname: doris-fe
    environment:
      FE_SERVERS: fe1:172.30.80.2:9010
      FE_ID: "1"
    ports:
      - "8030:8030"
      - "9030:9030"
    volumes:
      - fe-meta:/opt/apache-doris/fe/doris-meta
    networks:
      nereus:
        ipv4_address: 172.30.80.2
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8030/api/bootstrap | grep -q '\"code\":0'"]
      interval: 10s
      retries: 30

  doris-be:
    image: apache/doris:be-${DORIS_VERSION:-4.1.5}
    hostname: doris-be
    environment:
      FE_SERVERS: fe1:172.30.80.2:9010
      BE_ADDR: 172.30.80.3:9050
    volumes:
      - be-storage:/opt/apache-doris/be/storage
    depends_on:
      doris-fe:
        condition: service_healthy
    networks:
      nereus:
        ipv4_address: 172.30.80.3

  schema-init:
    image: mysql:8.0
    depends_on:
      doris-fe:
        condition: service_healthy
    volumes:
      - ../schema:/schema:ro
    entrypoint: ["bash", "-c"]
    command:
      - |
        for i in $$(seq 1 60); do
          mysql -h172.30.80.2 -P9030 -uroot -N -e 'show backends' | grep -q true && break
          sleep 5
        done
        /schema/apply.sh -h 172.30.80.2 -P 9030 -r $${RETENTION_DAYS:-30}
    environment:
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
    networks:
      nereus:

  otel-collector:
    image: otel/opentelemetry-collector-contrib:${OTELCOL_VERSION:-0.164.0}
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      DORIS_HTTP: http://172.30.80.2:8030
    volumes:
      - ../collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      schema-init:
        condition: service_completed_successfully
    networks:
      nereus:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: nereus
      POSTGRES_PASSWORD: ${META_PASSWORD:-nereus}
      POSTGRES_DB: nereus
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nereus"]
      interval: 5s
      retries: 30
    networks:
      nereus:

  nereus:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      DORIS_HOST: 172.30.80.2
      DORIS_PORT: "9030"
      DORIS_DB: otel
      META_DATABASE_URL: postgres://nereus:${META_PASSWORD:-nereus}@postgres:5432/nereus
      # Set to 1 behind HTTPS.
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      # Address of the UI, for the links in alert messages.
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8090}
      # Number of trusted proxies in front of the service (0: none), for per-client ingestion limits.
      TRUST_PROXY: ${TRUST_PROXY:-0}
      # Production: a Doris user that can only read telemetry (README, Security).
      # DORIS_USER: nereus
      # DORIS_PASSWORD: ${NEREUS_DORIS_PASSWORD}
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy
      schema-init:
        condition: service_completed_successfully
    networks:
      nereus:

  # Demo traffic. Remove when real applications send OTLP.
  telemetrygen:
    image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v${OTELCOL_VERSION:-0.164.0}
    command: ["traces", "--otlp-endpoint=otel-collector:4317", "--otlp-insecure", "--rate=50", "--duration=1h",
              "--service=demo"]
    depends_on:
      - otel-collector
    networks:
      nereus:

volumes:
  fe-meta:
  be-storage:
  pg-data:
